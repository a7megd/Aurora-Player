name: Build Aurora Player APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/aurora-player-next

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Aurora project
        run: unzip -o AuroraPlayer-stage3-continuation.zip -d .

      - name: Enable Android audio effects permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("AuroraPlayer/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
          if permission not in content:
              content = content.replace("<manifest", "<manifest", 1)
              pos = content.find(">", content.find("<manifest")) + 1
              content = content[:pos] + "\\n" + permission + content[pos:]
              manifest.write_text(content)
          PY

      - name: Apply maintained source overrides
        run: |
          install -D overrides/AppRoot.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/AppRoot.kt
          install -D overrides/NowPlayingScreen.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/NowPlayingScreen.kt
          install -D overrides/WhisperScreens.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/WhisperScreens.kt
          install -D overrides/Routes.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/Routes.kt
          install -D overrides/strings.xml AuroraPlayer/app/src/main/res/values/strings.xml
          install -D overrides/ic_whisper_mark.xml AuroraPlayer/app/src/main/res/drawable/ic_whisper_mark.xml
          install -D overrides/ic_launcher.xml AuroraPlayer/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          install -D overrides/whisper_icon_colors.xml AuroraPlayer/app/src/main/res/values/whisper_icon_colors.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle -p AuroraPlayer assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Player-APK
          path: AuroraPlayer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

