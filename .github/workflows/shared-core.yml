name: Whisper Player shared core (Android + iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/whisper-player-cross-platform-2026-11
    paths:
      - "shared-core/**"
      - "composeApp/**"
      - "cross-platform/**"
      - ".github/workflows/shared-core.yml"
  pull_request:
    paths:
      - "shared-core/**"
      - "composeApp/**"
      - "cross-platform/**"
      - ".github/workflows/shared-core.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test shared domain and compile shared Android UI
        run: |
          gradle -p cross-platform :shared-core:testDebugUnitTest
          gradle -p cross-platform :composeApp:assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Xcode toolchain
        run: xcodebuild -version
      - name: Compile shared iOS framework
        run: gradle -p cross-platform :composeApp:linkDebugFrameworkIosSimulatorArm64
