name: Whisper Player shared core (Android + iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/whisper-player-cross-platform-2026-11
    paths:
      - "shared-core/**"
      - "composeApp/**"
      - "cross-platform/**"
      - ".github/workflows/shared-core.yml"
  pull_request:
    paths:
      - "shared-core/**"
      - "composeApp/**"
      - "cross-platform/**"
      - ".github/workflows/shared-core.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test shared domain and compile shared Android UI
        run: |
          gradle -p cross-platform :shared-core:testDebugUnitTest
          gradle -p cross-platform :composeApp:assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Xcode toolchain
        run: xcodebuild -version
      - name: Compile shared iOS framework
        run: gradle -p cross-platform :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode application project
        run: xcodegen generate --spec iosApp/project.yml --project iosApp/WhisperPlayer.xcodeproj
      - name: Build iOS Simulator application
        run: |
          xcodebuild -project iosApp/WhisperPlayer.xcodeproj -scheme WhisperPlayer -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app for testing
        run: |
          mkdir -p build/ios-artifacts
          ditto build/ios-simulator/Build/Products/Debug-iphonesimulator/WhisperPlayer.app build/ios-artifacts/WhisperPlayer-Simulator.app
      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: whisper-player-ios-simulator
          path: build/ios-artifacts/WhisperPlayer-Simulator.app
          if-no-files-found: error
          retention-days: 14
