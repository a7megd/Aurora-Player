name: Whisper Player installable test APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/whisper-player-audio-bluetooth-2026-11
      - codex/whisper-player-cross-platform-2026-11

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: unzip -o AuroraPlayer-stage3-continuation.zip -d .
      - name: Apply maintained overrides
        run: |
          install -D overrides/AppRoot.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/AppRoot.kt
          install -D overrides/AuthScreens.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/AuthScreens.kt
          install -D overrides/ArticleScreens.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/ArticleScreens.kt
          install -D overrides/FirebaseCommunity.kt AuroraPlayer/app/src/main/java/com/aurora/player/community/FirebaseCommunity.kt
          install -D overrides/CloudinaryMediaUploader.kt AuroraPlayer/app/src/main/java/com/aurora/player/media/CloudinaryMediaUploader.kt
          install -D overrides/WhisperMessagingService.kt AuroraPlayer/app/src/main/java/com/aurora/player/community/WhisperMessagingService.kt
          install -D overrides/MusicApp.kt AuroraPlayer/app/src/main/java/com/aurora/player/MusicApp.kt
          install -D overrides/firestore.rules AuroraPlayer/firestore.rules
          install -D overrides/NowPlayingScreen.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/NowPlayingScreen.kt
          install -D overrides/WhisperScreens.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/WhisperScreens.kt
          install -D overrides/Routes.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/Routes.kt
          install -D overrides/MediaStoreScanner.kt AuroraPlayer/app/src/main/java/com/aurora/player/data/media/MediaStoreScanner.kt
          install -D overrides/LibraryRepository.kt AuroraPlayer/app/src/main/java/com/aurora/player/data/repository/LibraryRepository.kt
          install -D overrides/MediaToolsScreens.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/MediaToolsScreens.kt
          install -D overrides/WhisperMediaConverter.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/WhisperMediaConverter.kt
          install -D overrides/Lame.java AuroraPlayer/app/src/main/java/net/qiujuer/lame/Lame.java
      - name: Bundle native LAME encoder libraries
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/net/qiujuer/lame/lame/1.0.0/lame-1.0.0.aar -o /tmp/lame.aar
          mkdir -p /tmp/lame-aar AuroraPlayer/app/src/main/jniLibs
          unzip -o /tmp/lame.aar 'jni/*' -d /tmp/lame-aar
          test -d /tmp/lame-aar/jni
          cp -R /tmp/lame-aar/jni/. AuroraPlayer/app/src/main/jniLibs/
          install -D overrides/SocialScreens.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/SocialScreens.kt
          install -D overrides/PlaybackService.kt AuroraPlayer/app/src/main/java/com/aurora/player/playback/PlaybackService.kt
          install -D overrides/PlaybackConnection.kt AuroraPlayer/app/src/main/java/com/aurora/player/playback/PlaybackConnection.kt
          install -D overrides/StudyScreens.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/StudyScreens.kt
          install -D overrides/StudyLockController.kt AuroraPlayer/app/src/main/java/com/aurora/player/study/StudyLockController.kt
          install -D overrides/AudioOutputRouteCard.kt AuroraPlayer/app/src/main/java/com/aurora/player/ui/navigation/AudioOutputRouteCard.kt
          install -D overrides/app.build.gradle.kts AuroraPlayer/app/build.gradle.kts
          install -D overrides/debug-strings.xml AuroraPlayer/app/src/debug/res/values/strings.xml
          install -D overrides/strings.xml AuroraPlayer/app/src/main/res/values/strings.xml
          install -D overrides/ic_whisper_mark.xml AuroraPlayer/app/src/main/res/drawable/ic_whisper_mark.xml
          install -D overrides/ic_launcher.xml AuroraPlayer/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          install -D overrides/whisper_icon_colors.xml AuroraPlayer/app/src/main/res/values/whisper_icon_colors.xml
          python3 overrides/apply_media_features.py
          python3 overrides/apply_share_intents.py
      - name: Enable audio, recording and notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("AuroraPlayer/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.RECORD_AUDIO",
              "android.permission.POST_NOTIFICATIONS",
          ]
          for permission in permissions:
              line = f'    <uses-permission android:name="{permission}" />'
              if line not in content:
                  pos = content.find(">", content.find("<manifest")) + 1
                  content = content[:pos] + "\n" + line + content[pos:]
          service = '''
              <service
                  android:name="com.aurora.player.community.WhisperMessagingService"
                  android:exported="false">
                  <intent-filter>
                      <action android:name="com.google.firebase.MESSAGING_EVENT" />
                  </intent-filter>
              </service>
          '''
          if "WhisperMessagingService" not in content:
              content = content.replace("</application>", service + "\n</application>")
          manifest.write_text(content)
          PY
      - name: Enable Firebase network access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("AuroraPlayer/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          for perm in ['android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE']:
              line = f'    <uses-permission android:name="{perm}" />'
              if perm not in s:
                  i = s.find('>', s.find('<manifest')) + 1
                  s = s[:i] + "\n" + line + s[i:]
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable test APK
        env:
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: gradle -p AuroraPlayer -PcloudinaryUploadPreset="$CLOUDINARY_UPLOAD_PRESET" assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Whisper-Player-Bluetooth-Test-APK
          path: AuroraPlayer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
